services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vision:vision@postgres:5432/vision_companion
      ENABLE_SQLITE_FALLBACK: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/models/weights:/app/models/weights
    # Camera frames are processed in-memory / temp dirs inside the container
    # and are not bind-mounted.

volumes:
  postgres_data:
